<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151b" />
    <meta
      name="description"
      content="The personal site of Edgar Agunias."
    />
    <title>Edgar Agunias</title>
    <!-- Start the hero photograph before the script runs. These two rules
         mirror StoryImage in src/App.jsx. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/img-3327-1920.webp"
      media="(max-width: 600px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/images/img-3327-1600.webp 1600w, /images/img-3327-2400.webp 2400w"
      imagesizes="(max-aspect-ratio: 3/2) 151vh, 100vw"
      media="(min-width: 601px)"
      fetchpriority="high"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='0.88em' font-size='90' text-anchor='middle'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
